[package]
name = "prismdeck"
version = "0.1.0"
description = "Ultra-light deck shell for Prism Launcher"
authors = ["TaZ1kS"]
edition = "2021"
rust-version = "1.77.2"
license = "MIT"
repository = "https://github.com/TaZ1kS/prismdeck"

[lib]
name = "prismdeck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
